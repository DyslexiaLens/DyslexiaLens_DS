# DysRead Helper — Preprocessing Configuration
# ================================================
# Gunakan file ini untuk meng-override parameter default
# tanpa mengubah source code.
#
# Usage:
#   from src.preprocessing import load_config, preprocess_for_cnn
#   config = load_config('configs/preprocessing_config.yaml')
#   result = preprocess_for_cnn(image_path, config=config)

# ── Image Processing ──
target_size: [128, 128]           # Output size untuk CNN (H, W)
blur_kernel: [3, 3]               # Kernel Gaussian blur
morph_kernel_size: 3              # Kernel morfologi (opening/closing)
binarize_method: "otsu"           # "otsu", "sauvola", atau "adaptive"
sauvola_window: 25                # Window size untuk Sauvola thresholding
pad_color: 0                     # Warna padding (0=hitam, 255=putih)
noise_reduction_method: "bilateral"  # "gaussian", "median", "bilateral"

# ── Quality Gates ──
min_contour_area: 50              # Minimum area kontour (filter noise)
laplacian_threshold: 100          # Threshold blur detection (Laplacian variance)

# ── Synthetic Generation ──
synthetic:
  reversal_prob: 0.3              # Probabilitas letter reversal
  spacing_jitter: 0.4             # Intensitas jitter spasi (0-1)
  size_variation: 0.3             # Intensitas variasi ukuran (0-1)
  rotation_range: 15.0            # Range rotasi (derajat)
  baseline_drift: 0.2             # Intensitas drift baseline (0-1)
  tremor_intensity: 0.15          # Intensitas tremor stroke (0-1)
  samples_per_image: 3            # Jumlah sampel sintetis per gambar

# ── Data Split ──
split:
  train: 0.70                    # 70% training
  val: 0.15                      # 15% validation
  test: 0.15                     # 15% test
  random_seed: 42                # Seed untuk reproducibility
  stratified: true               # Stratified split (maintain class ratio)

# ── Rebalancing ──
rebalancing:
  target_ratio: 1.0              # 1.0 = seimbang sempurna
  max_augmentation_factor: 8     # Max augmentasi per gambar
  use_synthetic: true             # Gunakan synthetic generation

# ── Evaluation Thresholds ──
evaluation:
  min_recall: 0.90               # Target recall minimum
  min_f1: 0.80                   # Target F1 minimum
  confidence_threshold: 0.5      # Threshold klasifikasi default
